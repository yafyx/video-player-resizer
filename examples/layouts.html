<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Resizer · Wrapper</title>
    <style>
      :root { color-scheme: light; background: #f5f1e8; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: #f5f1e8; }
      .frame { width: min(100%, 720px); height: 0; overflow: hidden; padding-bottom: 56.25%; border-radius: 12px; background: #152027; }
      video { display: block; width: 100%; height: 100%; object-fit: cover; }
      video:focus-visible { outline: 3px solid #5d91b3; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <div class="frame">
      <video controls muted loop playsinline preload="metadata" aria-label="Flower video in a responsive wrapper">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
      </video>
    </div>
  </body>
</html>
